<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Blog Website Template</title>
    <link rel="stylesheet" href="./assets/CSS/styles.css">
    <link rel="stylesheet" href="./assets/CSS/responsive.css">
</head>

<body>
    <header>
        <nav class="navbar">
            <div class="left-nav font-2">
                <a href="#">
                    <span><img src="./assets/images/logo.png" alt="logo" width="94px"></span>
                </a>
                <ul>
                    <li><a href="./index.html">Home</a></li>
                    <li><a href="./index.html">About</a></li>
                    <li><a href="./contact.html">Contact</a></li>
                </ul>
            </div>
            <div class="right-nav font-1">
                <form action="./search.html" method="get">
                    <input type="text" name="query" placeholder="Search Article">
                    <button class="btn">Search</button>
                </form>

            </div>
        </nav>
    </header>

    <hr>

    <main class="contact-content">
        <div class="form-container">
            <h2>Contact Form UI Preview</h2>
            <p class="demo-notice">
                This is a static educational design demonstration. Do not enter personal information;
                no messages are collected or sent.
            </p>
            <div class="preview-field" aria-hidden="true">Name field preview</div>
            <div class="preview-field" aria-hidden="true">Message field preview</div>
            <button class="btn Submit" type="button" disabled>UI preview only</button>
        </div>
    </main>

    <footer>
        <p>Copyright &copy; iBlog.com </p>
        <a href="https://www.vecteezy.com/free-vector/typewriter">Vector Credits: Vecteezy</a>
    </footer>

</body>

</html>
